name: Release container

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib;
          actual=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          expected=os.environ['RELEASE_TAG'].removeprefix('v');
          assert actual == expected, f'package {actual} does not match tag {expected}'"
      - uses: docker/setup-buildx-action@v3
      - name: Build smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: autodrome:release-smoke
          build-args: AUTODROME_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: scripts/smoke_container.sh autodrome:release-smoke "$GITHUB_SHA"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Define release image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest
      - name: Publish release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: AUTODROME_COMMIT=${{ github.sha }}
          cache-from: type=gha
