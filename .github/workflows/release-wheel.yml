name: Release wheel

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          python -c "import os, tomllib;
          actual=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          expected=os.environ['RELEASE_TAG'].removeprefix('v');
          assert actual == expected, f'package {actual} does not match tag {expected}'"
      - run: python -m build
      - run: python scripts/smoke_wheel.py --install-dependencies dist/*.whl
      - name: Attach wheel to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.whl
